<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px;">
    <div style="background-color: white; padding: 20px; border-radius: 8px; max-width: 600px; margin: auto; box-shadow: 0px 4px 6px rgba(0,0,0,0.1);">
        <h2 style="color: #2c3e50; text-align: center;">Booking Confirmed</h2>
        <p style="font-size: 16px; color: #333;">Hello,</p>
        <p style="font-size: 16px; color: #333;">Your bus booking from <strong>{{ origin }}</strong> to <strong>{{ dest }}</strong> has been confirmed.</p>
        
        <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
            <tr>
                <td style="padding: 10px; border-bottom: 1px solid #ddd; font-weight: bold;">Booking ID</td>
                <td style="padding: 10px; border-bottom: 1px solid #ddd;">{{ booking_id }}</td>
            </tr>
            <tr>
                <td style="padding: 10px; border-bottom: 1px solid #ddd; font-weight: bold;">Date</td>
                <td style="padding: 10px; border-bottom: 1px solid #ddd;">{{ date }}</td>
            </tr>
            <tr>
                <td style="padding: 10px; border-bottom: 1px solid #ddd; font-weight: bold;">Seat(s)</td>
                <td style="padding: 10px; border-bottom: 1px solid #ddd;">{{ seats }}</td>
            </tr>
        </table>

        <p style="font-size: 16px; color: #333; margin-top: 20px;">Safe travels!</p>
        <p style="font-size: 14px; color: #777;">- The BusGo Team</p>
    </div>
</body>
</html>
