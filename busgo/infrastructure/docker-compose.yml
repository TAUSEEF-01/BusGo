    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres.wtldkwqnfynxfqyqvehy:BusGoLet'sGo@aws-1-ap-northeast-1.pooler.supabase.com:6543/postgres"
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: supersecretkey
      ENVIRONMENT: development
      SERVICE_NAME: payment-service
      SERVICE_DB: payment_db
