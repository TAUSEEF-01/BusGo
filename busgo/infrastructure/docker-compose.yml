  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: https://busgo.farefin.com
        VITE_BASE_PATH: /
        VITE_SUPABASE_URL: https://wtldkwqnfynxfqyqvehy.supabase.co
        VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0bGRrd3FuZnlueGZxeXF2ZWh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzY5NTU5NzcsImV4cCI6MjA1MjUzMTk3N30.sb_publishable_LzfdVkyS5xCYEwCVk41gug_yurc4LKV
    ports:
