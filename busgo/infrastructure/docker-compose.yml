x-service-defaults: &service-defaults
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_started
    kafka:
      condition: service_started
  networks:
    - busgo-network

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
      POSTGRES_MULTIPLE_DATABASES: auth_db,search_db,inventory_db,booking_db,payment_db,bank_db,ticket_db,notification_db,cancellation_db,operator_db,deals_db,admin_db,audit_db
    ports:
      - "${POSTGRES_PORT:-8086}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    networks:
      - busgo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-8087}:6379"
    networks:
      - busgo-network

  elasticsearch:
    image: elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - busgo-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - busgo-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT:-8088}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-8088}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - busgo-network

  kong:
    image: kong:3.4.0-ubuntu
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      # Status/metrics listener stays internal (Prometheus scrapes it over the
      # docker network); not published to a host port to avoid Windows-reserved
      # range conflicts (8081-8180).
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      # Use Docker's embedded DNS so scaled service replicas (multiple A-records)
      # are discovered and load-balanced by Kong's ring balancer.
      KONG_DNS_RESOLVER: 127.0.0.11
      KONG_DNS_STALE_TTL: "4"
    ports:
      - "${KONG_PORT:-8085}:8000"
      - "${KONG_ADMIN_PORT:-8089}:8001"
    volumes:
      - ./kong/kong.yml:/usr/local/kong/declarative/kong.yml
    networks:
      - busgo-network

  auth-service:
    <<: *service-defaults
    build:
      context: ../services/auth-service
    # Replicated for load balancing; reachable only via Kong (no host port so
    # replicas don't collide). Scale others the same way with --scale.
    deploy:
      replicas: 3
    volumes:
      - ../services/auth-service:/app
      - ../shared:/app/shared
    environment:
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "2"
      DATABASE_URL: "postgresql+asyncpg://postgres.wtldkwqnfynxfqyqvehy:BusGoLet'sGo@aws-1-ap-northeast-1.pooler.supabase.com:6543/postgres"
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: supersecretkey
      ENVIRONMENT: development
      SERVICE_NAME: auth-service
      SERVICE_DB: auth_db
      ROOT_PATH: /api/auth

  search-service:
    <<: *service-defaults
    build:
      context: ../services/search-service
    deploy:
      replicas: 3
    volumes:
      - ../services/search-service:/app
      - ../shared:/app/shared
    environment:
      DB_POOL_SIZE: "5"
