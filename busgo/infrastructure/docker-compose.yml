version: '3.8'

x-supabase-async-db: &supabase-async-db
  DATABASE_URL: postgresql+asyncpg://postgres.wtldkwqnfynxfqyqvehy:BusGoLet%27sGo@aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres

x-supabase-sync-db: &supabase-sync-db
  DATABASE_URL: postgresql://postgres.wtldkwqnfynxfqyqvehy:BusGoLet%27sGo@aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres

x-service-defaults: &service-defaults
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_started
    kafka:
      condition: service_started
  networks:
    - busgo-network
  dns:
    - 8.8.8.8
    - 8.8.4.4
    - 1.1.1.1

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_MULTIPLE_DATABASES: auth_db,search_db,inventory_db,booking_db,payment_db,ticket_db,notification_db,cancellation_db,operator_db,deals_db,admin_db,audit_db
    ports:
      - "8086:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    networks:
      - busgo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "8087:6379"
    networks:
      - busgo-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - busgo-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - busgo-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - zookeeper
    ports:
      - "8088:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:8088
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - busgo-network

  kong:
    image: kong:3.4.0-ubuntu
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
    ports:
      - "8085:8000"
      - "8089:8001"
    volumes:
      - ./kong/kong.yml:/usr/local/kong/declarative/kong.yml
    networks:
      - busgo-network

  auth-service:
    <<: *service-defaults
    build:
      context: ../services/auth-service
    volumes:
      - ../services/auth-service:/app
      - ../shared:/app/shared
    environment:
      <<: *supabase-async-db
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: supersecretkey
      ENVIRONMENT: development
      SERVICE_NAME: auth-service
      SERVICE_DB: auth_db

  search-service:
    <<: *service-defaults
    build:
      context: ../services/search-service
    volumes:
      - ../services/search-service:/app
      - ../shared:/app/shared
    environment:
      <<: *supabase-async-db
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: supersecretkey
      ENVIRONMENT: development
      SERVICE_NAME: search-service
      SERVICE_DB: search_db

  inventory-service:
    <<: *service-defaults
    build:
      context: ../services/inventory-service
    volumes:
      - ../services/inventory-service:/app
      - ../shared:/app/shared
    environment:
