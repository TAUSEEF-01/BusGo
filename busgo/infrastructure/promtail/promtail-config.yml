server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

# Discover every container via the Docker daemon and ship its stdout to Loki.
# Services emit structured JSON logs (shared/observability.py), so we parse the
# JSON to surface `level`, `service` and `request_id` for filtering/tracing.
scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
    pipeline_stages:
      - json:
          expressions:
            level: level
            request_id: request_id
            svc: service
      # Keep only low-cardinality labels. request_id stays a parsed field, so
      # trace a single request with:  {service="booking-service"} | json | request_id="<id>"
      - labels:
          level:
