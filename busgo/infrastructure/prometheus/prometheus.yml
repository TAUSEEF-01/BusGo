global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Each service exposes /metrics (prometheus-fastapi-instrumentator). We use DNS
# A-record discovery on the Docker Compose service name so that when a service
# is scaled, EVERY replica IP is discovered and scraped individually.
scrape_configs:
  - job_name: kong
    metrics_path: /metrics
    static_configs:
      - targets: ["kong:8001"]

  - job_name: auth-service
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["auth-service"]
        type: A
        port: 8000

  - job_name: search-service
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["search-service"]
        type: A
        port: 8000

  - job_name: inventory-service
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["inventory-service"]
        type: A
        port: 8000

