_format_version: "3.0"
_transform: true

# Each service points at a Kong *upstream* (not a raw host). An upstream load
# balances across all healthy targets and runs active + passive health checks,
# so traffic is automatically spread across replicas and rerouted away from
# unhealthy ones. `retries` re-dispatches a failed request to another target.
#
# Targets use the Docker Compose service name (e.g. auth-service:8000). When a
# service is scaled (`--scale auth-service=3`), Docker's embedded DNS returns one
# A-record per replica and Kong's ring balancer round-robins across them.

services:
  - name: auth-service
    url: http://auth-upstream
    retries: 3
    routes:
      - name: auth-route
        paths:
          - /api/auth
        strip_path: true
  - name: search-service
    url: http://search-upstream
    retries: 3
    routes:
      - name: search-route
        paths:
          - /api/search
        strip_path: true
  - name: inventory-service
    url: http://inventory-upstream
    retries: 3
    routes:
      - name: inventory-route
        paths:
          - /api/inventory
        strip_path: true
  - name: booking-service
    url: http://booking-upstream
    retries: 3
    routes:
      - name: booking-route
        paths:
          - /api/bookings
          - /api/booking
        strip_path: true
  - name: payment-service
    url: http://payment-upstream
    retries: 3
    routes:
      - name: payment-route
        paths:
          - /api/payments
          - /api/payment
        strip_path: true
  - name: bank-service
    url: http://bank-upstream
    retries: 3
    routes:
