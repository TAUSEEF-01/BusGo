        paths:
          - /api/bank
        strip_path: true
  - name: ticket-service
    url: http://ticket-upstream
    retries: 3
    routes:
      - name: ticket-route
        paths:
          - /api/tickets
          - /api/ticket
        strip_path: true
  - name: cancellation-service
    url: http://cancellation-upstream
    retries: 3
