  - name: operator-service
    url: http://operator-upstream
    retries: 3
    routes:
      - name: operator-route
        paths:
          - /api/operators
          - /api/operator
        strip_path: true
  - name: deals-service
    url: http://deals-upstream
    retries: 3
    routes:
      - name: deals-route
        paths:
          - /api/deals
          - /api/deal
        strip_path: true
  - name: admin-service
    url: http://admin-upstream
    retries: 3
    routes:
      - name: admin-route
        paths:
          - /api/admin
        strip_path: true
  - name: audit-service
    url: http://audit-upstream
    retries: 3
    routes:
