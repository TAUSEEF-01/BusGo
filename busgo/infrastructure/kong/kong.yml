      - name: notification-route
        paths:
          - /api/notifications
          - /api/notification
        strip_path: true
  - name: transit-service
    url: http://transit-upstream
    retries: 3
    routes:
      - name: transit-route
        paths:
          - /api/transit
        strip_path: true

# Active checks poll /health on every target; passive checks trip a target out
# of rotation as a circuit breaker on errors. The first upstream defines the
# shared health-check block via a YAML anchor that the rest alias.
upstreams:
  - name: auth-upstream
    targets: [{ target: "auth-service:8000", weight: 100 }]
    healthchecks: &default-healthchecks
      active:
        type: http
        http_path: /health
        timeout: 3
        concurrency: 5
        healthy:
          interval: 5
          successes: 1
        unhealthy:
          interval: 5
          http_failures: 3
          tcp_failures: 3
          timeouts: 3
      passive:
        type: http
        healthy:
          successes: 3
        unhealthy:
          http_failures: 5
          tcp_failures: 3
          timeouts: 3
  - name: search-upstream
    targets: [{ target: "search-service:8000", weight: 100 }]
    healthchecks: *default-healthchecks
  - name: transit-upstream
    targets: [{ target: "transit-service:8000", weight: 100 }]
    healthchecks: *default-healthchecks
  - name: inventory-upstream
    targets: [{ target: "inventory-service:8000", weight: 100 }]
    healthchecks: *default-healthchecks
  - name: booking-upstream
    targets: [{ target: "booking-service:8000", weight: 100 }]
    healthchecks: *default-healthchecks
  - name: payment-upstream
    targets: [{ target: "payment-service:8000", weight: 100 }]
    healthchecks: *default-healthchecks
  - name: bank-upstream
    targets: [{ target: "bank-service:8000", weight: 100 }]
    healthchecks: *default-healthchecks
  - name: ticket-upstream
    targets: [{ target: "ticket-service:8000", weight: 100 }]
    healthchecks: *default-healthchecks
  - name: cancellation-upstream
    targets: [{ target: "cancellation-service:8000", weight: 100 }]
    healthchecks: *default-healthchecks
  - name: operator-upstream
    targets: [{ target: "operator-service:8000", weight: 100 }]
    healthchecks: *default-healthchecks
  - name: deals-upstream
    targets: [{ target: "deals-service:8000", weight: 100 }]
    healthchecks: *default-healthchecks
  - name: admin-upstream
    targets: [{ target: "admin-service:8000", weight: 100 }]
    healthchecks: *default-healthchecks
  - name: audit-upstream
    targets: [{ target: "audit-service:8000", weight: 100 }]
    healthchecks: *default-healthchecks
  - name: notification-upstream
    targets: [{ target: "notification-service:8000", weight: 100 }]
    healthchecks: *default-healthchecks

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:5173
        - http://localhost:5174
        - http://135.171.216.245
        - http://135.171.216.245:80
        - http://busgo.farefin.com
        - https://busgo.farefin.com
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
        - X-Request-ID
      credentials: true
  - name: rate-limiting
    config:
      # Per-client-IP cap. 300/min is high enough for normal browsing and load
      # tests, while still demonstrably rejecting abusive bursts with HTTP 429.
      minute: 300
      policy: local
      limit_by: ip
  - name: request-transformer
    config:
      add:
        headers:
          - X-Service-Name:kong
  # Generate/propagate a correlation id so a single request can be traced across
  # the gateway and every downstream service (see shared/observability.py).
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true
  # Expose Kong's own RED metrics (requests, errors, latencies, upstream health)
  # for Prometheus to scrape from the Admin API at /metrics.
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      upstream_health_metrics: true

# Note: In a real production setup, the jwt plugin would be attached per-route.
